<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 001</title>
  <!-- Raleway font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body class="raleway-normal">
  <header class="header">
    <nav>
      <h1 class="nav-logo inter-normal">LOGO</h1>
      <button class="nav-signup">Sign Up</button>
    </nav>
    <div class="banner">
      <h1 class="banner-title1">Cool Dark UI Template for <span class="banner-title2">Webflow Agencies!</span></h1>
      <button class="banner-btn">Stay Focused</button>
    </div>
  </header>
  <main>
    <!-- action sectioin -->
    <div class="action-section">
      <div class="action">
        <h1 class="action-title">See It in Action</h1>
        <p class="action-subtitle">Explore the live preview and imagine your brand in this bold new look.</p>
        <button class="action-btn">Launch Live Preview</button>
      </div>
      <img class="action-img" src="Assets/wc-mini.png" alt="wc-mini">
    </div>
    
    <!-- users section -->
    <div class="users-section">
      <h2 class="users-title">Joined Thousands of Productive Users</h2>

      <!-- .users>.user*3>h1.user-title+p.user-subtitle -->
      <div class="users">
        <div class="user">
          <h1 class="user-title inter-normal">50K</h1>
          <p class="user-subtitle">Active Users</p>
        </div>
        <div class="user">
          <h1 class="user-title inter-normal">2M+</h1>
          <p class="user-subtitle">Focus Sessions</p>
        </div>
        <div class="user">
          <h1 class="user-title inter-normal">95%</h1>
          <p class="user-subtitle">Satisfaction Rate</p>
        </div>
      </div>
    </div>
  </main>
  <footer>

  </footer>
</body>

</html>
